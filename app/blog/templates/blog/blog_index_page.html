{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="max-w-4xl mx-auto py-8">
  <h1 class="text-3xl font-bold mb-4">{{ page.title }}</h1>
  <div class="prose mb-6">{{ page.intro|richtext }}</div>

  <div class="grid gap-6">
    {% for post in page.get_children.live %}
    {% with post.specific as blog %}
    <a href="{{ blog.url }}" class="block p-4 border border-gray-200 hover:shadow transition">
      <h2 class="text-xl font-semibold">{{ blog.title }}</h2>
      <p class="text-sm text-gray-500">{{ blog.date }}</p>
      <p class="mt-2 text-gray-700">{{ blog.intro }}</p>
    </a>
    {% endwith %}
    {% endfor %}
  </div>
</div>
{% endblock %}
