services:
  # SQLite browser UI — accessible at http://localhost:8080
  # https://hub.docker.com/r/linuxserver/sqlitebrowser
  sqlitebrowser:
    image: lscr.io/linuxserver/sqlitebrowser:latest
    container_name: sqlitebrowser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - ./db.sqlite3:/app/db.sqlite3
    ports:
      - 8080:3000
